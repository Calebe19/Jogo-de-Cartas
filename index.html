<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memoria</title>
    <link rel="stylesheet" href="jogo.css">
</head>
<body>
    <main class="jogo">
        <h1>Jogo de Memoria</h1>

        <section class="placar">
           <div class="jogador ativo" id="placar-1">
            <span class="nome">Jogador 1</span>
            <span class="pontos" id="pontos-1">0</span>
            </div>
            <div class="jogador" id="placar-2">
            <span class="nome">Jogador 2</span>
            <span class="pontos" id="pontos-2">0</span>
            </div>
        </section>
        <p class="mensagem" id="mensagem-vez">Vez de jogador</p>
        <section class="resultado escondido" id="resultado">
            <p id="texto-resultado"></p>
            <button id="btn-reiniciar">Jogar Novamente</button>
        </section>
     </main>
     <script src="jogo.js"></script>
    
</body>
</html>
