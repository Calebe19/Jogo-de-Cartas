<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="jogo">
        <h1>Jogo da Memória</h1>

        <section class="placar" aria-label="Placar da partida">
            <div class="jogador ativo" id="placar-1">
                <span class="nome">Jogador 1</span>
                <span class="pontos" id="pontos-1">0</span>
            </div>

            <div class="jogador" id="placar-2">
                <span class="nome">Jogador 2</span>
                <span class="pontos" id="pontos-2">0</span>
            </div>
        </section>

        <p class="mensagem" id="mensagem-vez">Vez do Jogador 1</p>
        <section class="tabuleiro" id="tabuleiro" aria-label="Tabuleiro do jogo"></section>

        <section class="resultado escondido" id="resultado">
            <p id="texto-resultado"></p>
            <button id="btn-reiniciar" type="button">Jogar novamente</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
